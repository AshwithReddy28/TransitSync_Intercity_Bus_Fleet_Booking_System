spring:
  application:
    name: transitsync-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/transitsync_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: always

jwt:
  secret: ${JWT_SECRET:4c65637572655472616e73697453796e633230323653757065725365637265744b65793132333435}
  expiration: ${JWT_EXPIRATION_MS:86400000} # 24 hours

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://safar-bus-booking.vercel.app,https://*.vercel.app}

admin:
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
    email: ${ADMIN_BOOTSTRAP_EMAIL:admin@transitsync.com}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:Admin@Transit2026!}
    name: ${ADMIN_BOOTSTRAP_NAME:Super Administrator}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
